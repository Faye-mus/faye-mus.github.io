:root{color-scheme:dark;--paper:#343434;--ink:#c4c4c4;--muted:#adadad;--line:#535353;--serif:Georgia,"Songti SC",serif;--sans:"IBM Plex Mono","PingFang SC",monospace;--mono:"IBM Plex Mono","PingFang SC",monospace;--display:"Doto","IBM Plex Mono",monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:28px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}p,h1,h2,h3,figure,dl,dd{margin:0}button,a,summary{-webkit-tap-highlight-color:transparent}::selection{background:#666666;color:#d2d2d2}:focus-visible{outline:1px solid currentColor;outline-offset:5px}
body:not(.zh) .zh,body.zh .en{display:none!important}
.wrap{width:min(1280px,calc(100% - 80px));margin-inline:auto}
.skip{position:fixed;top:8px;left:8px;z-index:5;padding:8px 16px;background:var(--ink);color:var(--paper);transform:translateY(-160%)}.skip:focus{transform:none}
.site-head{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:30px;min-height:90px}
.signature{font:500 14px/1.3 var(--mono);letter-spacing:-.06em;white-space:nowrap}
.navigation{display:flex;align-items:center;gap:5px;padding:4px;border-radius:7px;background:#3f3f3fd9;border:1px solid #4b4b4b;font:11px/1.5 var(--mono)}
.navigation a{padding:7px 17px;border-radius:4px;transition:background .2s,color .2s}.navigation a:hover{background:#515151;color:#cccccc}
.language{display:flex;align-items:center;gap:9px;padding:0 11px 0 20px;font-size:10px;white-space:nowrap}
.language button{border:0;background:none;padding:4px 0;cursor:pointer;color:var(--muted);line-height:1.4}
.language button[aria-pressed=true]{color:var(--ink)}.language span{color:#7b7b7b}
.hero{position:relative;isolation:isolate;min-height:625px;height:calc(100svh - 142px);display:flex;align-items:flex-end;padding:0 0 58px}
.hero-copy{position:relative;z-index:2;width:100%;display:grid;grid-template-columns:minmax(0,1fr) 310px;column-gap:45px;pointer-events:none}
.hero-copy a{pointer-events:auto}
.eyebrow{grid-column:1/3;font:10px/1.6 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#adadad}
h1{grid-column:1;font:400 clamp(65px,8.1vw,104px)/1.08 var(--mono);letter-spacing:-.065em;margin:18px 0}
.cn-name{grid-column:1;display:block;font:12px/1.8 var(--mono);letter-spacing:.25em;margin-left:4px;color:var(--muted)}
.intro{grid-column:2;grid-row:2/4;align-self:end;font:12px/1.8 var(--mono);color:#b7b7b7;margin:0 0 6px}
.hero-copy .small-link{grid-column:1;justify-self:start;display:inline-flex;align-items:center;gap:18px;margin-top:27px;background:#505050;color:#c9c9c9;border:1px solid #6b6b6b;border-radius:4px;padding:9px 15px;font:10px/1.6 var(--mono);transition:background .2s,color .2s}
.small-link:hover{background:#5c5c5c;color:#d2d2d2}
.hero-art{position:absolute;inset:-90px -40px 0;z-index:0;overflow:hidden}
.ink-stage{position:absolute;inset:0;touch-action:pan-y;cursor:grab;outline-offset:-5px}
.ink-stage:active{cursor:grabbing}.ink-stage canvas{display:block;width:100%;height:100%;pointer-events:none}

<script>
const titles = {"en": "Relit", "zh": "Relit"};
let language = 'en';
try { if (localStorage.getItem('fy-lang') === 'zh') language = 'zh'; } catch {}
function setLanguage(next) {
  document.body.classList.toggle('zh', next === 'zh');
  document.documentElement.lang = next === 'zh' ? 'zh-CN' : 'en';
  document.title = (titles[next] || titles.en || titles.zh) + ' — Feihong Yu';
  for (const code of ['en','zh']) document.getElementById('lang-' + code).setAttribute('aria-pressed', String(code === next));
  try { localStorage.setItem('fy-lang', next); } catch {}
}
document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
document.getElementById('lang-zh').addEventListener('click', () => setLanguage('zh'));
setLanguage(language);
document.getElementById('year').textContent = new Date().getFullYear();
</script>
